<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载中... | 又来笔记</title>

    <link rel="stylesheet" href="/css/markdown.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+SC:wght@400;700;900&display=swap');
    </style>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css"
        rel="stylesheet" />

    <style>
        /* --- 基础变量 --- */
        :root {
            --p5-red: #D20505;
            --p5-black: #151515;
            --p5-grey: #222;
            --p5-white: #f0f0f0;
            --p5-paper: #fff;
            --p5-yellow: #fce100;
        }

        body {
            margin: 0;
            background-color: var(--p5-grey);
            font-family: 'Noto Sans SC', sans-serif;
            color: #333;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
        }

        /* --- Loading --- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--p5-black);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .loading-text {
            font-family: 'Bangers';
            color: var(--p5-white);
            font-size: 4rem;
            transform: rotate(-5deg);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.1) rotate(-5deg);
                color: var(--p5-red);
            }
        }

        /* --- 导航 --- */
        .mini-nav {
            background: var(--p5-black);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-bottom: 4px solid var(--p5-red);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .home-btn {
            color: var(--p5-white);
            text-decoration: none;
            font-family: 'Bangers';
            font-size: 1.4rem;
            display: flex;
            align-items: center;
        }

        .home-btn:hover {
            color: var(--p5-yellow);
        }

        /* --- 布局 --- */
        .layout-container {
            max-width: 1400px;
            margin: 100px auto 40px;
            display: flex;
            gap: 40px;
            padding: 0 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* 侧边栏 */
        .toc-sidebar {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--p5-white);
            padding: 20px;
            clip-path: polygon(0 0, 100% 0, 100% 95%, 90% 100%, 0 100%);
        }

        /* P5R 风格滚动条 */
        .toc-sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .toc-sidebar::-webkit-scrollbar-track {
            background: var(--p5-black);
            border-left: 1px solid #333;
        }

        .toc-sidebar::-webkit-scrollbar-thumb {
            background: var(--p5-red);
            border-radius: 0;
        }

        .toc-sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--p5-yellow);
        }

        .toc-title {
            font-family: 'Bangers';
            color: var(--p5-red);
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            border-bottom: 2px dashed #666;
        }

        #toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #toc-list a {
            display: block;
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 5px 10px;
            border-left: 3px solid transparent;
            transition: 0.2s;
            transform: skewX(-5deg);
        }

        #toc-list a:hover,
        #toc-list a.active {
            color: black;
            background: var(--p5-yellow);
            border-left: 5px solid var(--p5-red);
        }

        #toc-list .toc-h3 {
            margin-left: 15px;
            font-size: 0.85rem;
        }

        /* 正文区 */
        .article-main {
            flex: 1;
            min-width: 0;
            background: var(--p5-paper);
            padding: 60px 80px;
            box-shadow: 10px 10px 0 var(--p5-black);
            border-top: 5px solid var(--p5-black);
        }

        @media (max-width: 1024px) {
            .layout-container {
                flex-direction: column;
            }

            .toc-sidebar {
                width: auto;
                position: static;
                height: auto;
                margin-bottom: 20px;
            }

            .article-main {
                padding: 30px;
            }
        }

    </style>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']], // 让 $E=mc^2$ 生效
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</head>

<body>

    <div id="loading-screen">
        <div class="loading-text">加载中...</div>
    </div>

    <nav class="mini-nav">
        <a href="/" class="home-btn"><span>◄ 又来笔记</span></a>
    </nav>

    <div id="error-container" style="display:none;"></div>

    <div class="layout-container" id="main-content">
        <aside class="toc-sidebar">
            <h3 class="toc-title">目录</h3>
            <ul id="toc-list"></ul>
        </aside>

        <main class="article-main">
            <div id="content-render-area" class="markdown-body"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Modified to support /posts/:id path
            let postId;
            const pathParts = window.location.pathname.split('/');
            // Check if last part is ID (e.g. /posts/123)
            if (pathParts.length > 0 && pathParts[pathParts.length - 1] !== '') {
                postId = pathParts[pathParts.length - 1];
            } else {
                // Fallback to query param if any
                const params = new URLSearchParams(window.location.search);
                postId = params.get('id');
            }

            const loadingScreen = document.getElementById('loading-screen');
            const contentArea = document.getElementById('main-content');
            const renderArea = document.getElementById('content-render-area');
            const tocList = document.getElementById('toc-list');
            const errorContainer = document.getElementById('error-container');

            if (!postId) {
                showError("未找到 ID - 目标丢失");
                return;
            }

            // 动态请求 MD 文件
            fetch(`/posts/${postId}.md`)
                .then(response => {
                    if (!response.ok) throw new Error("文件未找到 (404)");
                    return response.text();
                })
                .then(text => {
                    // 0. 解析并移除 YAML Frontmatter
                    let metadata = {};
                    const frontMatterRegex = /^---[\r\n]+([\s\S]*?)[\r\n]+---/;
                    const match = text.match(frontMatterRegex);
                    
                    if (match) {
                        // 简单的 YAML 解析
                        const yaml = match[1];
                        yaml.split('\n').forEach(line => {
                            const parts = line.split(':');
                            if (parts.length >= 2) {
                                const key = parts[0].trim();
                                const value = parts.slice(1).join(':').trim();
                                // 处理数组 [a, b]
                                if (value.startsWith('[') && value.endsWith(']')) {
                                     metadata[key] = value.slice(1, -1).split(',').map(s => s.trim());
                                } else {
                                     metadata[key] = value;
                                }
                            }
                        });
                        // 从正文中移除 Frontmatter
                        text = text.replace(match[0], '');
                    }

                    // 1. 解析 MD -> HTML
                    renderArea.innerHTML = marked.parse(text);

                    // 设置标题 (优先使用 Frontmatter 标题)
                    const h1 = renderArea.querySelector('h1');
                    const pageTitle = metadata.title || (h1 ? h1.innerText : 'Untitled');
                    document.title = pageTitle + " | 又来笔记";
                    
                    // 如果 Frontmatter 有标题且正文没 H1，可以考虑手动插入标题 (可选)
                    // if (metadata.title && !h1) {
                    //     const titleEl = document.createElement('h1');
                    //     titleEl.innerText = metadata.title;
                    //     renderArea.prepend(titleEl);
                    // }

                    // 2. 【新】修正图片路径
                    // MD里写 ![xx](img/1.png) -> 浏览器解析为 root/img/1.png (错)
                    // 修正为 root/posts/img/1.png (对)
                    const imgs = renderArea.querySelectorAll('img');
                    imgs.forEach(img => {
                        const src = img.getAttribute('src');
                        // 如果不是网络图片(http)且不是绝对路径(/)
                        if (!src.startsWith('http') && !src.startsWith('//') && !src.startsWith('/')) {
                            img.src = '/posts/' + src; // 使用绝对路径 /posts/
                        }
                    });

                    // 3. 代码高亮 & 复制按钮
                    Prism.highlightAll();

                    // 4. 【新】渲染数学公式 (MathJax)
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([renderArea]).catch((err) => {
                            console.warn('MathJax rendering failed:', err);
                        });
                    }

                    // 5. 生成目录
                    generateTOC();

                    // 6. 显示内容
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.remove(), 500);
                    contentArea.style.opacity = '1';
                })
                .catch(err => {
                    showError(err.message);
                });

            // --- 辅助工具 ---
            function showError(msg) {
                loadingScreen.style.display = 'none';
                errorContainer.style.display = 'block';
                errorContainer.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
            }

            function generateTOC() {
                const headers = renderArea.querySelectorAll('h1, h2, h3');
                headers.forEach((header, index) => {
                    const id = 'header-' + index;
                    header.id = id;

                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#' + id;
                    a.innerText = header.innerText;
                    if (header.tagName === 'H3') a.classList.add('toc-h3');

                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
                    });

                    li.appendChild(a);
                    tocList.appendChild(li);
                });

                // 滚动监听
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            document.querySelectorAll('#toc-list a').forEach(link => link.classList.remove('active'));
                            const activeLink = document.querySelector(`#toc-list a[href="#${entry.target.id}"]`);
                            if (activeLink) {
                                activeLink.classList.add('active');
                                // 让导航栏滚动到激活的链接位置（只滚动侧边栏容器，不影响页面）
                                const tocSidebar = document.querySelector('.toc-sidebar');
                                if (tocSidebar) {
                                    const linkTop = activeLink.offsetTop;
                                    const sidebarHeight = tocSidebar.clientHeight;
                                    const linkHeight = activeLink.clientHeight;
                                    // 计算让链接居中的滚动位置
                                    const scrollTo = linkTop - (sidebarHeight / 2) + (linkHeight / 2);
                                    tocSidebar.scrollTo({ top: scrollTo, behavior: 'smooth' });
                                }
                            }
                        }
                    });
                }, { rootMargin: '-100px 0px -70% 0px' });
                headers.forEach(h => observer.observe(h));
            }
        });
    </script>
</body>

</html>
