<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>又来博客</title>
    <link rel="icon" type="image/jpeg" href="/img/icon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/background.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/posts.css">
    <link rel="stylesheet" href="/css/model.css">
    <link rel="stylesheet" href="/css/markdown.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css" rel="stylesheet" />
    <script>window.IS_ADMIN = true;</script>
</head>

<body>
    <div class="bg-layer">
        <div class="bg-stripes"></div>
        <div class="bg-dots"></div>
        <div class="shape shape-star" style="top: 10%; left: 10%; animation-duration: 8s;">★</div>
        <div class="shape shape-star"
            style="top: 50%; right: 15%; animation-duration: 12s; font-size: 1.5rem; color:var(--p5-yellow);">★</div>
        <div class="shape shape-shard" style="left: 20%; width: 60px; height: 60px; animation-delay: 0s;"></div>
        <div class="shape shape-shard" style="left: 70%; width: 40px; height: 40px; animation-delay: 5s;"></div>
        <div class="shape shape-shard"
            style="left: 45%; width: 80px; height: 80px; animation-delay: 2s; background: var(--p5-black);"></div>
        <div class="shape shape-jagged" style="top: 80%; left: 5%; animation-duration: 3s;"></div>
        <div class="shape shape-jagged" style="top: 20%; right: 5%; animation-duration: 4s; transform: scale(0.5);">
        </div>
    </div>

    <nav class="top-nav">
        <div class="marquee-wrap">
            <div class="marquee-content">加载中...</div>
        </div>
        <a href="#" class="brand-logo" onclick="filterPosts('HOME'); return false;">YOULAI NOTE</a>
        <div class="menu-list">
            <a href="#" id="btn-home" class="menu-btn active" onclick="filterPosts('HOME'); return false;">首页</a>
            <a href="#" id="btn-discovery" class="menu-btn" onclick="showDiscoveryPage(); return false;">发现</a>
            <a href="#" id="btn-about" class="menu-btn" onclick="showAboutPage(); return false;">关于</a>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="搜索日志..." oninput="searchPosts(this.value)">
                <i class="fas fa-search search-icon"></i>
            </div>

            <a href="editor.html" class="menu-btn" style="background:var(--p5-red); color:white; margin-left:20px;">
                + ADD BOLG
            </a>
        </div>
    </nav>

    <div class="container">
        <div style="flex:3; display:flex; flex-direction:column;">
            <main class="content-area" id="blog-list-container">
                <h2 style="color:white; font-family:'Bangers'; text-align:center; margin-top:50px;">初始化中...</h2>
            </main>
        </div>

        <aside class="sidebar-area" id="main-sidebar">
            <div class="widget-box" id="toc-widget" style="display: none;">
                <div class="widget-title">目录</div>
                <div id="toc-content" style="margin-top: 15px; max-height: 400px; overflow-y: auto;">
                    <!-- TOC Content will be injected here -->
                </div>
            </div>
            <div class="widget-box" id="webmaster-widget">
                <div class="widget-title">站长</div>
                <div class="profile-mini" style="margin-top: 15px;">
                    <img src="/img/head.jpg" alt="Avatar" onerror="this.src='https://placehold.co/60x60'">
                    <div>
                        <div style="font-weight:900; color:var(--p5-white);">又来</div>
                        <div style="font-size:0.8rem; color:#aaa;">独立开发者</div>
                    </div>
                </div>
                <!-- 个人简介文本 -->
                <div style="margin: 15px 0; font-size: 0.9rem; color: #ddd; line-height: 1.6;">
                    吃的好，睡得好，就开心😄！
                </div>
                <div class="social-links" id="social-links-container"></div>
                <div id="email-display" class="email-box" style="display:none;">
                    <i class="fas fa-envelope"></i> <span id="email-text"></span>
                </div>
            </div>
            <div class="widget-box">
                <div class="widget-title">分类</div>
                <div class="tag-cloud" style="margin-top: 15px;">
                    <a href="#" class="tag-item" onclick="filterPosts('UNITY'); return false;"># UNITY3D</a>
                    <a href="#" class="tag-item" onclick="filterPosts('CSHARP'); return false;"># CSHARP</a>
                    <a href="#" class="tag-item" onclick="filterPosts('SHADER'); return false;"># SHADER</a>
                    <a href="#" class="tag-item" onclick="filterPosts('MULTIPLAYER'); return false;"># MULTIPLAYER</a>
                    <a href="#" class="tag-item" onclick="filterPosts('VR'); return false;"># VR/AR</a>
                </div>
            </div>
        </aside>
    </div>

    <footer class="footer-bar">
        <div class="footer-info">
            <div><span id="footer-copyright" style="font-weight:900; color:var(--p5-yellow);">© 2025 又来笔记.</span> 代码即世界.</div>
            <a href="https://beian.miit.gov.cn/" style="margin-top: 8px; font-size: 0.85rem; color: #aaa;">
                湘ICP备2026001893号</a>
        </div>
    </footer>

    <script src="/js/model.js"></script>
    <script src="/js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>
</body>

</html>
