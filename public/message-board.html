<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站留言板 | 又来笔记</title>
    <meta name="description" content="网站留言板：欢迎留言、交流与反馈。">
    <link rel="icon" type="image/jpeg" href="/img/icon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/background.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/markdown.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="bg-layer">
        <div class="bg-stripes"></div>
        <div class="bg-dots"></div>
        <div class="shape shape-star" style="top: 10%; left: 10%; animation-duration: 8s;">★</div>
        <div class="shape shape-star"
            style="top: 50%; right: 15%; animation-duration: 12s; font-size: 1.5rem; color:var(--p5-yellow);">★</div>
        <div class="shape shape-shard" style="left: 20%; width: 60px; height: 60px; animation-delay: 0s;"></div>
        <div class="shape shape-shard" style="left: 70%; width: 40px; height: 40px; animation-delay: 5s;"></div>
        <div class="shape shape-shard"
            style="left: 45%; width: 80px; height: 80px; animation-delay: 2s; background: var(--p5-black);"></div>
        <div class="shape shape-jagged" style="top: 80%; left: 5%; animation-duration: 3s;"></div>
        <div class="shape shape-jagged" style="top: 20%; right: 5%; animation-duration: 4s; transform: scale(0.5);">
        </div>
    </div>

    <nav class="top-nav">
        <div class="marquee-wrap">
            <div class="marquee-content">留言板页面（占位）- 后续将接入留言提交与展示</div>
        </div>
        <a href="/" class="brand-logo">YOULAI NOTE</a>
        <div class="menu-list">
            <a href="/" class="menu-btn">首页</a>
            <a href="/columns" class="menu-btn">专栏</a>
            <a href="/message-board" class="menu-btn active">留言板</a>
        </div>
    </nav>

    <div class="container">
        <div style="flex:3; display:flex; flex-direction:column;">
            <main class="content-area">
                <div class="markdown-body paper-pattern-white" style="padding:40px; box-shadow:10px 10px 0 var(--p5-black); border-top:5px solid var(--p5-black);">
                    <h1 style="margin-top:0;">网站留言板</h1>
                    <p style="margin-top:10px; color:#444;">文章留言会显示在对应文章底部；这里是全站留言。</p>

                    <div class="comment-form" style="margin-top:18px;">
                        <div class="comment-form-row">
                            <div class="comment-field">
                                <div class="comment-label">昵称</div>
                                <input id="site-comment-name" placeholder="匿名访客" class="comment-input">
                            </div>
                        </div>
                        <div class="comment-field" style="margin-top:14px;">
                            <div class="comment-label">联系方式（可选）</div>
                            <input id="site-comment-contact" placeholder="邮箱/微信/网址（仅管理员可见）" class="comment-input">
                        </div>
                        <div class="comment-field" style="margin-top:14px;">
                            <div class="comment-label">留言内容</div>
                            <textarea id="site-comment-content" rows="5" placeholder="写下你的想法..." class="comment-textarea"></textarea>
                        </div>
                        <div class="comment-actions" style="margin-top:14px;">
                            <button id="site-comment-submit" class="p5-cta-btn" type="button">提交</button>
                            <a class="p5-cta-btn p5-cta-btn--ghost" href="/">返回首页</a>
                            <div id="site-comment-status" class="comment-status"></div>
                        </div>
                    </div>

                    <h3 style="margin-top:34px;">最新留言</h3>
                    <div id="site-comments-list" class="comment-list" style="margin-top:12px;"></div>
                </div>
            </main>
        </div>

        <aside class="sidebar-area">
            <div class="widget-box">
                <div class="widget-title">提示</div>
                <div style="margin-top: 15px; font-size: 0.95rem; color: #ddd; line-height: 1.7;">
                    <div>1) 本页是网站留言板</div>
                    <div style="margin-top:8px;">2) 文章留言在文章底部</div>
                    <div style="margin-top:8px;">3) 内容仅支持纯文本</div>
                </div>
            </div>
        </aside>
    </div>

    <footer class="footer-bar">
        <div class="footer-info">
            <div>
                <span id="footer-copyright" style="font-weight:900; color:var(--p5-yellow);">© 2025 又来笔记.</span>
                代码即世界.
            </div>
            <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 8px;">
                <a href="https://beian.miit.gov.cn/" style="font-size: 0.85rem; color: #aaa;">湘ICP备2026001893号</a>
                <a href="https://beian.mps.gov.cn/#/query/webSearch?code=43010402002500" rel="noreferrer" target="_blank"
                    style="font-size: 0.85rem; color: #aaa; display: flex; align-items: center; gap: 5px;">
                    <img src="/img/备案图标.png" alt="" style="width: 18px; height: 18px;">
                    湘公网安备43010402002500号
                </a>
            </div>
        </div>
    </footer>

    <script src="/js/message-board.js"></script>
</body>

</html>
