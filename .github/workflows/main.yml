name: Deploy to Tencent Cloud

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    name: Trigger Server Script
    runs-on: ubuntu-latest
    steps:
    - name: Call deploy.sh via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.KEY }}
        port: 22
        # 只需要这一行，让服务器自己动
        script: /www/wwwroot/deploy.sh